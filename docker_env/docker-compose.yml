services:
  data_collection:
    image: data_collection:latest
    container_name: data_collection_container
    build:
      context: .
      args:
        USERNAME: ${USERNAME:-defaultuser}
        UID: ${DOCKER_UID:-1000}
        GID: ${DOCKER_GID:-1000}
    privileged: true
    network_mode: host
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    volumes:
      - /dev:/dev
      - ../:/app
      - /tmp/.X11-unix:/tmp/.X11-unix
    stdin_open: true
    tty: true
