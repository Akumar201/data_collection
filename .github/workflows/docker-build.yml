name: Build Docker Container

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build container
        env:
          USERNAME: ci_user
          DOCKER_UID: 1001
          DOCKER_GID: 1001
        run: ./scripts/build_data_collection.sh

      - name: Verify image exists
        run: docker image inspect data_collection:latest --format '{{.Architecture}}'
